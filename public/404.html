<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalConnect — Loading...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      (function() {
        var l = window.location;
        var pathname = l.pathname;
        var segments = pathname.split('/').filter(Boolean);
        var isUserSite = l.hostname.split('.')[0] === (segments[0] || '');
        var repo = isUserSite ? '' : (segments.length > 0 ? '/' + segments[0] : '');
        var route = isUserSite ? segments.join('/') : segments.slice(1).join('/');
        var search = l.search || '';
        var hash = l.hash || '';
        // Redirect to hash route so HashRouter can load the view without server 404
        var target = repo + '/#/' + (route ? route : '') + search + hash;
        l.replace(target);
      })();
    </script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #F7F9FC;
        color: #172B4D;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        text-align: center;
      }
      .card {
        background: white;
        padding: 32px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        max-width: 400px;
        border: 1px solid #E2E8F0;
      }
      h2 { color: #16324F; margin-top: 0; font-size: 20px; }
      p { color: #64748B; font-size: 14px; margin-bottom: 0; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Loading LocalConnect...</h2>
      <p>Redirecting to your requested page...</p>
    </div>
  </body>
</html>
